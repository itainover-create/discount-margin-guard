<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" role="img" aria-label="ORION GAMES">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb35c"/><stop offset="0.55" stop-color="#e8641b"/><stop offset="1" stop-color="#a83a0c"/>
    </linearGradient>
    <radialGradient id="star" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#d9ecff"/><stop offset="1" stop-color="#7fb8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- emblem: orbit ring, Orion's belt, swept wing -->
  <g transform="translate(80 80)">
    <circle r="62" fill="#0b1424" stroke="url(#ring)" stroke-width="9"/>
    <path d="M-70 18 C -20 -6, 30 -14, 74 -40 L 64 -22 C 26 -2, -18 10, -66 30 Z" fill="#ffffff" opacity="0.92"/>
    <circle cx="-26" cy="16" r="9" fill="url(#star)"/>
    <circle cx="0" cy="0" r="10" fill="url(#star)"/>
    <circle cx="26" cy="-16" r="9" fill="url(#star)"/>
    <circle cx="-30" cy="-34" r="5" fill="#cfe6ff"/>
    <circle cx="34" cy="38" r="5" fill="#cfe6ff"/>
  </g>
  <text x="165" y="92" font-family="'Exo 2', Arial, sans-serif" font-weight="800" font-size="70" letter-spacing="6" fill="#ffffff">ORION</text>
  <text x="168" y="132" font-family="'Exo 2', Arial, sans-serif" font-weight="600" font-size="30" letter-spacing="17" fill="#e8641b">GAMES</text>
</svg>
